<section class="admin">
  <header class="admin__header">
    <h1>Teacher Dashboard</h1>
    <p>Add videos and manage the checkpoints students will see.</p>
  </header>

  <section class="admin__card">
    <h2>Add a video</h2>
    <form class="admin__form" (ngSubmit)="addVideo()">
      <label>
        Title
        <input
          type="text"
          [ngModel]="title()"
          (ngModelChange)="title.set($event)"
          name="title"
          placeholder="e.g. Introduction to Photosynthesis"
        />
      </label>

      <label>
        Description
        <textarea
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
          name="description"
          rows="2"
          placeholder="One or two sentences for students"
        ></textarea>
      </label>

      <label>
        YouTube link
        <input
          type="text"
          [ngModel]="urlOrId()"
          (ngModelChange)="urlOrId.set($event)"
          name="urlOrId"
          placeholder="https://www.youtube.com/watch?v=..."
        />
      </label>

      <p class="admin__error" *ngIf="formError()">{{ formError() }}</p>

      <button class="btn btn--primary" type="submit">Add video</button>
    </form>
  </section>

  <section class="admin__card" *ngIf="videos$ | async as videos">
    <h2>Your videos</h2>
    <ul class="admin__video-list">
      <li *ngFor="let video of videos">
        <div class="admin__video-info">
          <strong>{{ video.title }}</strong>
          <span>{{ video.annotations.length }} checkpoint(s)</span>
        </div>
        <div class="admin__video-actions">
          <a [routerLink]="['/admin/videos', video.id]" class="btn">Manage checkpoints</a>
          <a [routerLink]="['/videos', video.id]" class="btn">Preview</a>
          <button class="btn btn--danger" type="button" (click)="removeVideo(video.id)">
            Remove
          </button>
        </div>
      </li>

      <li class="admin__empty" *ngIf="!videos.length">No videos yet — add one above.</li>
    </ul>
  </section>
</section>
